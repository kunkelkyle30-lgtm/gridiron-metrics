<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gridiron Metrics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: Gridiron Metrics brand, committed dark like the helmet logo. Header band with GM badge and helmet stripe, then report card, blueprint steps, league board. */
:root {
  --bg: #0B0C0E;
  --card: #15171B;
  --card-2: #1C1F24;
  --ink: #F2F3F5;
  --ink-2: #B4B9C2;
  --ink-3: #828894;
  --line: #2A2E35;
  --line-2: #22252B;
  --navy: #101114;
  --orange: #F26A21;
  --orange-2: #FF8A47;
  --accent: #F26A21;
  --accent-soft: #3A2216;
  --chrome: #C9CDD3;
  --good: #5FD08F; --good-soft: #15301F;
  --warn: #F2B544; --warn-soft: #382A10;
  --bad: #FF7A6B;  --bad-soft: #3B1A16;
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; margin: 0; }
.band { background: radial-gradient(120% 140% at 85% 0%, #23262C 0%, var(--navy) 55%); color: var(--ink); position: relative; border-bottom: 1px solid var(--line); }
.band::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 6px; background: linear-gradient(90deg, transparent 0 calc(50% - 22px), #fff calc(50% - 22px) calc(50% - 16px), var(--orange) calc(50% - 16px) calc(50% + 16px), #fff calc(50% + 16px) calc(50% + 22px), transparent calc(50% + 22px)); }
.band .in, .main {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.band .in { padding-block: 22px 22px; display: grid; gap: 16px; }
.brand { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
.lockup { display: flex; align-items: center; gap: 14px; }
.badge { width: 52px; height: 52px; flex: none; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #3A3E45, #0D0E10 70%); border: 2px solid var(--chrome); box-shadow: 0 0 0 3px var(--navy), 0 0 0 4px var(--orange); font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: -0.02em; color: #fff; }
.badge b { color: var(--orange); font-weight: 900; }
h1 { margin: 0; line-height: 0.9; display: grid; }
h1 .g { font-family: var(--display); font-weight: 900; font-size: 36px; letter-spacing: 0.02em; text-transform: uppercase; color: #fff; }
h1 .m { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 0.55em; text-transform: uppercase; color: var(--orange); padding-left: 2px; }
.tagline { color: var(--ink-2); margin: 0; font-size: 15px; max-width: 44ch; }
.tool { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--chrome); }
.connect { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.4fr) minmax(0, 1.4fr) auto; gap: 10px; align-items: end; }
@media (max-width: 800px) { .connect { grid-template-columns: 1fr 1fr; } .connect .go { grid-column: 1 / -1; } }
@media (max-width: 460px) { .connect { grid-template-columns: 1fr; } }
.f { display: grid; gap: 4px; min-width: 0; }
.lbl { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
.band input, .band select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 5px; padding: 9px 11px; width: 100%; min-width: 0; }
.band select option { color: var(--ink); background: var(--card); }
.band input::placeholder { color: var(--ink-3); }
.go { font-family: var(--display); font-weight: 800; font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; background: var(--orange); color: #111; border: 0; border-radius: 5px; padding: 10px 18px; cursor: pointer; }
.go:hover { background: var(--orange-2); }
.go:disabled { opacity: 0.6; cursor: default; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.msg { font-size: 14px; color: var(--ink-2); min-height: 1.5em; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.msg .err { color: var(--bad); }
.chip-sample { font-family: var(--display); font-weight: 800; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; background: var(--orange); color: #111; border-radius: 3px; padding: 1px 7px; }

.main { padding-block: 22px 48px; display: grid; gap: 22px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
h2 { font-family: var(--display); font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: 0.02em; margin: 0; line-height: 1.1; }
h3 { font-family: var(--display); font-weight: 700; font-size: 18px; text-transform: uppercase; letter-spacing: 0.03em; margin: 0; }
.muted { color: var(--ink-3); font-size: 13px; }

/* Report card */
.report { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 0; overflow: hidden; }
@media (max-width: 820px) { .report { grid-template-columns: 1fr; } }
.window { padding: 20px; display: grid; gap: 12px; align-content: start; border-right: 1px solid var(--line); }
@media (max-width: 820px) { .window { border-right: 0; border-bottom: 1px solid var(--line); } }
.team-name { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.05; text-wrap: balance; }
.verdict { display: inline-flex; align-items: center; gap: 8px; justify-self: start; font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 14px; border-radius: 4px; border: 2px solid currentColor; }
.verdict.contend { color: var(--good); background: var(--good-soft); }
.verdict.rebuild { color: var(--bad); background: var(--bad-soft); }
.verdict.retool, .verdict.rising { color: var(--warn); background: var(--warn-soft); }
.window p { margin: 0; color: var(--ink-2); max-width: 52ch; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpi { border-top: 2px solid var(--line); padding-top: 6px; min-width: 0; }
.kpi .k { font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.kpi .v { font-family: var(--mono); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--ink-3); }
.grades { padding: 20px; display: grid; gap: 14px; align-content: start; }
.grade-row { display: grid; grid-template-columns: 40px 52px 40px minmax(0, 1fr); gap: 10px; align-items: center; }
.grade-row.ghead { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); text-align: center; margin-bottom: -6px; }
.grade-row.ghead span:last-child { text-align: left; letter-spacing: 0.04em; text-transform: none; font-family: var(--body); font-weight: 400; font-size: 12px; }
.letter.sm { font-size: 18px; line-height: 1.55; opacity: 0.9; }
.srcs { display: flex; flex-wrap: wrap; gap: 6px; }
.src { font-size: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 2px 9px; color: var(--ink-2); }
.src small { color: var(--ink-3); font-size: 12px; }
.src.warn { color: var(--warn); border-color: var(--warn); }
.tag { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 3px; padding: 1px 6px; }
.tag.up { background: var(--good-soft); color: var(--good); } .tag.down { background: var(--warn-soft); color: var(--warn); }
.trend { font-family: var(--mono); font-size: 12px; } .trend.up { color: var(--good); } .trend.down { color: var(--bad); }
.side-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
tr.starter td:first-child { box-shadow: inset 3px 0 0 var(--orange); }
tr.pickrow td { color: var(--ink-2); }
.pos { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: 0.04em; }
.letter { font-family: var(--display); font-weight: 800; font-size: 26px; text-align: center; border-radius: 4px; line-height: 1.25; }
.letter.A { color: var(--good); background: var(--good-soft); }
.letter.B { color: var(--accent); background: var(--accent-soft); }
.letter.C { color: var(--warn); background: var(--warn-soft); }
.letter.D, .letter.F { color: var(--bad); background: var(--bad-soft); }
.gbar { display: grid; gap: 3px; min-width: 0; }
.track { position: relative; height: 10px; background: var(--line-2); border-radius: 5px; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--accent); }
.avgmark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-2); }
.gmeta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-3); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.gmeta b { color: var(--ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--ink-3); }
.legend i { display: inline-block; vertical-align: middle; margin-right: 5px; }
.legend .sw { width: 14px; height: 8px; border-radius: 4px; background: var(--accent); }
.legend .tk { width: 2px; height: 12px; background: var(--ink-2); }

/* Blueprint */
.plan { display: grid; gap: 14px; }
.step { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 0; overflow: hidden; }
.step-n { background: var(--card-2); border-right: 2px solid var(--orange); color: var(--orange); font-family: var(--display); font-weight: 800; font-size: 28px; display: grid; place-items: start center; padding-top: 16px; }
.step-b { padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.step-b > p { margin: 0; color: var(--ink-2); max-width: 70ch; }
.moves { display: grid; gap: 10px; }
.move { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.move-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.act { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; }
.act.add, .act.start, .act.get { background: var(--good-soft); color: var(--good); }
.act.drop, .act.bench, .act.give { background: var(--bad-soft); color: var(--bad); }
.act.with { background: var(--accent-soft); color: var(--accent); }
.pl { font-weight: 600; }
.pm { font-family: var(--mono); font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.why { font-size: 14px; color: var(--ink-2); margin: 0; }
.trade { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
@media (max-width: 560px) { .trade { grid-template-columns: 1fr; } }
.side { background: var(--bg); border-radius: 5px; padding: 8px 10px; display: grid; gap: 4px; min-width: 0; }
.empty { color: var(--ink-3); font-size: 14px; margin: 0; }
.inj { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: 0.06em; color: var(--bad); border: 1px solid currentColor; border-radius: 3px; padding: 0 4px; }

/* League board */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
td.n { font-family: var(--mono); text-align: right; }
th.n { text-align: right; }
tr.me td { background: var(--accent-soft); }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--line-2); }
tr.me.click:hover td { background: var(--accent-soft); }
.wtag { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
.wtag.contend { color: var(--good); } .wtag.rebuild { color: var(--bad); } .wtag.retool, .wtag.rising { color: var(--warn); }
.board { padding: 16px 0 4px; display: grid; gap: 10px; }
.board .sec-h { padding: 0 16px; }
.method { padding: 16px 18px; display: grid; gap: 8px; }
.method ul { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 14px; display: grid; gap: 4px; }
.loading { padding: 28px; text-align: center; color: var(--ink-3); }

[hidden] { display: none !important; }
.tabs { background: var(--navy); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.tabs .in { display: flex; gap: 4px; overflow-x: auto; padding-block: 0; }
.tabs a { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); text-decoration: none; padding: 12px 14px 10px; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a.on { color: var(--ink); border-bottom-color: var(--orange); }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; background: var(--card); color: var(--ink-2); border: 0; border-right: 1px solid var(--line); padding: 7px 12px; cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--orange); color: #111; }
.pad { padding: 0 16px 14px; }
.intro { padding: 18px; display: grid; gap: 10px; }
.intro p { margin: 0; color: var(--ink-2); max-width: 75ch; }
.empty-state { padding: 22px; display: grid; gap: 6px; } .empty-state p { margin: 0; color: var(--ink-2); }
.kpi.hero .v { color: var(--orange); font-size: 26px; }
.movesec { padding: 16px 18px; display: grid; gap: 12px; }
.move.ranked { gap: 10px; }
.move-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; }
.scores { display: flex; gap: 14px; }
.score { display: grid; justify-items: end; line-height: 1.1; }
.score .k { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.delta { font-family: var(--mono); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.delta.big { font-size: 20px; }
.delta.pos { color: var(--good); } .delta.neg { color: var(--bad); }
.note { font-size: 13px; color: var(--ink-3); margin: 0; max-width: 90ch; }
.minibar { display: inline-block; width: 44px; height: 6px; background: var(--line-2); border-radius: 3px; vertical-align: middle; overflow: hidden; }
.minibar i { display: block; height: 100%; background: var(--orange); border-radius: 3px; }
.profiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.prof { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.prof.me { border-color: var(--orange); }
.prof-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.ptag { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; border-radius: 3px; padding: 1px 7px; background: var(--card-2); color: var(--ink-2); border: 1px solid var(--line); }
.ptag.good { background: var(--good-soft); color: var(--good); border-color: transparent; } .ptag.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; } .ptag.muted { color: var(--ink-3); }
.txlog { display: grid; gap: 10px; margin-top: 10px; }
.tx { border-top: 1px solid var(--line-2); padding-top: 10px; display: grid; gap: 6px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
.edges { display: grid; gap: 14px; }
.hitgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.hitbox { border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 6px; min-width: 0; }
.hitlegend { margin-bottom: 4px; }
.hrow { display: grid; grid-template-columns: 82px minmax(0, 1fr) 38px; gap: 8px; align-items: center; font-size: 13px; }
.hrow .hp { grid-column: 2 / -1; margin-top: -4px; }
.hb { color: var(--ink-2); white-space: nowrap; }
.hbar { position: relative; height: 10px; background: var(--line-2); border-radius: 5px; overflow: hidden; }
.hbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--orange); opacity: 0.55; }
.hbar b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--orange); }
.hv { font-family: var(--mono); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.legend .sw.elite { background: var(--orange); } .legend .sw { opacity: 0.55; } .legend .sw.elite { opacity: 1; }
.scorepill { font-family: var(--mono); font-weight: 600; background: var(--accent-soft); color: var(--orange); border-radius: 4px; padding: 1px 6px; }
td.wrapcell { white-space: normal; min-width: 220px; max-width: 320px; }
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} img{max-width:100%}</style>
</head>
<body>

<div class="band">
  <div class="in">
    <div class="brand">
      <div class="lockup">
        <div class="badge" aria-hidden="true">G<b>M</b></div>
        <h1><span class="g">Gridiron</span><span class="m">Metrics</span></h1>
      </div>
      <div>
        <div class="tool">Dynasty Lab</div>
        <p class="tagline">Title odds for every move, expert-vs-market edges, and the college pipeline.</p>
      </div>
    </div>
    <form class="connect" id="connect">
      <label class="f"><span class="lbl">Sleeper username</span><input id="user" type="text" autocomplete="off" placeholder="your_username"></label>
      <label class="f"><span class="lbl">League</span><select id="league" disabled><option>Enter a username first</option></select></label>
      <label class="f"><span class="lbl">Team to analyze</span><select id="team" disabled><option>—</option></select></label>
      <button class="go" id="go" type="submit">Find leagues</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>
</div>

<nav class="tabs" id="tabs" aria-label="Sections"><div class="in">
  <a href="#team" data-tab="team">My Team</a><a href="#league" data-tab="league">League</a><a href="#edges" data-tab="edges">Edges</a><a href="#college" data-tab="college">College</a>
</div></nav>
<div class="main" id="view-team"></div>
<div class="main" id="view-league" hidden></div>
<div class="main" id="view-edges" hidden></div>
<div class="main" id="view-college" hidden></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const POS = ["QB", "RB", "WR", "TE"];
  const FLEX_ELIG = { FLEX: ["RB","WR","TE"], SUPER_FLEX: ["QB","RB","WR","TE"], REC_FLEX: ["WR","TE"], WRRB_FLEX: ["RB","WR"] };
  const WEEK_STATUS = { Out: 0, IR: 0, PUP: 0, Sus: 0, NA: 0, Doubtful: 0.3, Questionable: 0.85 };
  const ROS_STATUS = { Out: 0.55, IR: 0.15, PUP: 0.15, Sus: 0.5, NA: 0.3, Doubtful: 0.75, Questionable: 0.95 };
  const ROUND = ["", "1st", "2nd", "3rd", "4th", "5th", "6th", "7th"];
  const SELL_AGE = { RB: 26, WR: 28, TE: 29, QB: 32 };

  // ---------------- small helpers ----------------
  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) { if (attrs[k] == null) continue; if (k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
    kids.flat(Infinity).forEach((c) => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
    return e;
  }
  const f1 = (v) => (v == null || !isFinite(v)) ? "—" : v.toFixed(1);
  const f0 = (v) => (v == null || !isFinite(v)) ? "—" : String(Math.round(v));
  const pct = (v, d = 0) => (v == null || !isFinite(v)) ? "—" : (100 * v).toFixed(d) + "%";
  const pp = (v) => (v == null || !isFinite(v)) ? "—" : (v >= 0 ? "+" : "−") + Math.abs(100 * v).toFixed(1);

      let name; do { name = first[Math.floor(rnd() * first.length)] + " " + last[Math.floor(rnd() * last.length)]; } while (used.has(name)); used.add(name);
      const age = Math.round(ageR[pos][0] + (ageR[pos][1] - ageR[pos][0]) * Math.pow(rnd(), 1.3));
      const ppg = Math.max(1, (shape[pos][0] + (shape[pos][1] - shape[pos][0]) * Math.pow(rnd(), 1.6) * ageMult(pos, age) / 1.1) * (scale || 1));
      const base = Math.max(0, (ppg - shape[pos][0]) * 5 * ageMult(pos, age)) * (pos === "QB" ? 1.4 : 1) + (age <= 23 ? 6 : 0);
      const dp = Math.min(100, base * (0.85 + rnd() * 0.3)), fc = Math.min(100, base * (0.85 + rnd() * 0.3));
      const id = "s" + (++n);
      players[id] = { id, name, pos, nfl: nflT[Math.floor(rnd() * nflT.length)], age, inj: rnd() < 0.06 ? (rnd() < 0.5 ? "Questionable" : "Out") : null, gp: 9, ppg, proj: ppg * (0.8 + rnd() * 0.4), active: true, src: { dp, fc }, val: (dp + fc) / 2, trend: (rnd() - 0.5) * 0.2 };
      return id;
    };
    const slots = ["QB","RB","RB","WR","WR","WR","TE","FLEX","SUPER_FLEX", ...Array(14).fill("BN")];
    const names = ["Example Squad","Gridiron Alchemists","Fourth & Long Shots","The Taxi Squad","Waiver Wire Bandits","Dynasty Dreamers","Run It Back","Hail Mary Holdings","Red Zone Regulars","Bench Mob"];
    const teams = names.map((nm, i) => { const ids = []; [["QB",3],["RB",6],["WR",8],["TE",3]].forEach(([p, c]) => { for (let k = 0; k < c; k++) ids.push(make(p)); }); const w = Math.floor(rnd() * 9);
      return { id: String(i + 1), name: nm, owner: "", wins: w, losses: 9 - w, ties: 0, pf: 900 + rnd() * 350, ids, starters: [], taxi: new Set(), reserve: new Set() }; });
    const fa = []; [["QB",6],["RB",14],["WR",16],["TE",8]].forEach(([p, c]) => { for (let k = 0; k < c; k++) { const id = make(p, 0.75); players[id].val *= 0.5; fa.push(id); } });
    const pk = (a, b) => ({ v1: a, v2: b });
    const dp = { max1: 10000, max2: 10000, players: {}, date: "", picks: { "2027 Early 1st": pk(4386, 5220), "2027 Mid 1st": pk(1985, 2317), "2027 Late 1st": pk(928, 1086), "2028 1st": pk(1605, 1888), "2027 Early 2nd": pk(457, 537), "2027 Mid 2nd": pk(237, 280), "2027 Late 2nd": pk(129, 153), "2028 2nd": pk(192, 227), "2027 Early 3rd": pk(73, 88), "2027 Mid 3rd": pk(44, 53), "2027 Late 3rd": pk(27, 34), "2028 3rd": pk(35, 43), "2027 Early 4th": pk(18, 23), "2027 Mid 4th": pk(12, 16), "2027 Late 4th": pk(9, 12), "2028 4th": pk(10, 13) } };
    const ids = teams.map((t) => t.id), schedule = [];
    for (let w = 10; w <= 14; w++) { const rot = ids.slice(1); for (let k = 0; k < w; k++) rot.push(rot.shift()); const order = [ids[0], ...rot]; const pairs = []; for (let i = 0; i < order.length / 2; i++) pairs.push([order[i], order[order.length - 1 - i]]); schedule.push({ w, pairs }); }
    const Lg = { name: "Example League", season: "2026", week: 10, slots, teams, players, fa, hasProj: true, fmt: "Superflex · PPR", isDynasty: true, typeLabel: "Dynasty", sample: true, sf: true, dp, fc: null, sources: [], statsOnly: false, inSeason: true, lastReg: 14, playoffTeams: 6, schedule };
    L = Lg;
    buildPicks(Lg, [{ season: "2027", round: 1, roster_id: "4", owner_id: "1" }], 4);
    teams.forEach((t) => { t.starters = optimalLineup(t.ids, slots, (id) => players[id].ppg).map((x) => x.id).filter(Boolean); const b = t.ids.find((id) => players[id].pos === "RB" && !t.starters.includes(id)); const i = t.starters.findIndex((id) => players[id].pos === "RB"); if (b && i >= 0 && rnd() < 0.6) t.starters[i] = b; });
    return Lg;
  }

  // ---------------- routing & wiring ----------------
  const VIEWS = { team: renderTeam, league: renderLeague, edges: renderEdges, college: renderCollege };
  function route() {
    let v = (location.hash || "").replace("#", ""); if (!VIEWS[v]) v = "team";
    Object.keys(VIEWS).forEach((k) => { $("view-" + k).hidden = k !== v; });
    document.querySelectorAll("#tabs a").forEach((a) => { const on = a.dataset.tab === v; a.classList.toggle("on", on); if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    VIEWS[v]();
  }
  window.addEventListener("hashchange", route);
  function useLeague(Lg, teamId) {
    L = Lg; analyze(L);
    myTeamId = teamId || L.teams[0].id;
    const sel = $("team"); sel.innerHTML = "";
    L.teams.forEach((t) => sel.append(el("option", { value: t.id }, t.name + (t.owner ? " (" + t.owner + ")" : ""))));
    sel.value = myTeamId; sel.disabled = false;
    route();
  }
  $("connect").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = $("user").value.trim(); if (!name) { setMsg(errMsg("Enter your Sleeper username.")); return; }
    $("go").disabled = true; setMsg("Looking up " + name + "…");
    try {
      me = await getJSON("https://api.sleeper.app/v1/user/" + encodeURIComponent(name));
      if (!me || !me.user_id) throw new Error("notfound");
      store.set("fob_user", name);
      const st = await nflState(); const season = String(st.league_season || st.season || "2026");
      let ls = await getJSON(`https://api.sleeper.app/v1/user/${me.user_id}/leagues/nfl/${season}`);
      if (!ls.length) ls = await getJSON(`https://api.sleeper.app/v1/user/${me.user_id}/leagues/nfl/${parseInt(season, 10) - 1}`);
      leagues = ls.sort((a, b) => ((b.settings && b.settings.type) === 2) - ((a.settings && a.settings.type) === 2));
      const sel = $("league"); sel.innerHTML = "";
      if (!leagues.length) { sel.append(el("option", null, "No leagues found")); sel.disabled = true; setMsg(errMsg("No " + season + " leagues found for " + name + ".")); return; }
      leagues.forEach((l) => sel.append(el("option", { value: l.league_id }, l.name + " · " + ((l.settings && l.settings.type) === 2 ? "Dynasty" : (l.settings && l.settings.type) === 1 ? "Keeper" : "Redraft"))));
      sel.disabled = false;
      await openLeague(leagues[0].league_id);
    } catch (err) { setMsg(errMsg(err.message === "notfound" ? `No Sleeper user named "${name}". Check the spelling.` : "Couldn't reach Sleeper (" + err.message + "). Check your connection and try again.")); }
    finally { $("go").disabled = false; }
  });
  $("league").addEventListener("change", () => openLeague($("league").value));
  $("team").addEventListener("change", () => { myTeamId = $("team").value; route(); });
  async function openLeague(id) {
    const lg = leagues.find((l) => l.league_id === id); if (!lg) return;
    setMsg("Loading " + lg.name + ": rosters, schedule, stats and market values…");
    $("view-team").innerHTML = ""; $("view-team").append(el("div", { class: "card loading" }, "Crunching the numbers…"));
    try {
      const Lg = await loadLeague(lg);
      Lg._db = await playersDB().catch(() => ({}));
      const mine = Lg.teams.find((t) => t.ownerId === me.user_id);
      edgesSF = null; colSF = null;
      useLeague(Lg, mine && mine.id);
      const notes = [L.name + " · " + L.teams.length + " teams · " + L.fmt];
      if (L.sources.length === 1) notes.push(errMsg(L.sources[0].key === "dp" ? "FantasyCalc didn't load, so values use FantasyPros consensus only." : "FantasyPros consensus didn't load, so values use FantasyCalc only."));
      if (L.statsOnly) notes.push(errMsg("Neither value source loaded. Grades use a stats-only estimate."));
      if (!L.isDynasty) notes.push(errMsg("This is a " + L.typeLabel.toLowerCase() + " league; dynasty values still drive grades."));
      setMsg(...notes);
    } catch (err) { setMsg(errMsg("Couldn't load that league (" + err.message + "). Try again, or pick another league.")); $("view-team").innerHTML = ""; }
  }
  const saved = store.get("fob_user"); if (saved) $("user").value = saved;
  useLeague(sampleLeague(), "1");
  setMsg(el("span", { class: "chip-sample" }, "Example"), "A made-up league with invented players. Enter your Sleeper username to load yours.");
})();
</script>
