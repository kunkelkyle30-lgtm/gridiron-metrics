<title>Gridiron Metrics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: Gridiron Metrics brand, committed dark like the helmet logo. Header band with GM badge and helmet stripe, then report card, blueprint steps, league board. */
:root {
  --bg: #0B0C0E;
  --card: #15171B;
  --card-2: #1C1F24;
  --ink: #F2F3F5;
  --ink-2: #B4B9C2;
  --ink-3: #828894;
  --line: #2A2E35;
  --line-2: #22252B;
  --navy: #101114;
  --orange: #F26A21;
  --orange-2: #FF8A47;
  --accent: #F26A21;
  --accent-soft: #3A2216;
  --chrome: #C9CDD3;
  --good: #5FD08F; --good-soft: #15301F;
  --warn: #F2B544; --warn-soft: #382A10;
  --bad: #FF7A6B;  --bad-soft: #3B1A16;
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; margin: 0; }
.band { background: radial-gradient(120% 140% at 85% 0%, #23262C 0%, var(--navy) 55%); color: var(--ink); position: relative; border-bottom: 1px solid var(--line); }
.band::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 6px; background: linear-gradient(90deg, transparent 0 calc(50% - 22px), #fff calc(50% - 22px) calc(50% - 16px), var(--orange) calc(50% - 16px) calc(50% + 16px), #fff calc(50% + 16px) calc(50% + 22px), transparent calc(50% + 22px)); }
.band .in, .main {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.band .in { padding-block: 22px 22px; display: grid; gap: 16px; }
.brand { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
.lockup { display: flex; align-items: center; gap: 14px; }
.badge { width: 52px; height: 52px; flex: none; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #3A3E45, #0D0E10 70%); border: 2px solid var(--chrome); box-shadow: 0 0 0 3px var(--navy), 0 0 0 4px var(--orange); font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: -0.02em; color: #fff; }
.badge b { color: var(--orange); font-weight: 900; }
h1 { margin: 0; line-height: 0.9; display: grid; }
h1 .g { font-family: var(--display); font-weight: 900; font-size: 36px; letter-spacing: 0.02em; text-transform: uppercase; color: #fff; }
h1 .m { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 0.55em; text-transform: uppercase; color: var(--orange); padding-left: 2px; }
.tagline { color: var(--ink-2); margin: 0; font-size: 15px; max-width: 44ch; }
.tool { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--chrome); }
.connect { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.4fr) minmax(0, 1.4fr) auto; gap: 10px; align-items: end; }
@media (max-width: 800px) { .connect { grid-template-columns: 1fr 1fr; } .connect .go { grid-column: 1 / -1; } }
@media (max-width: 460px) { .connect { grid-template-columns: 1fr; } }
.f { display: grid; gap: 4px; min-width: 0; }
.lbl { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
.band input, .band select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 5px; padding: 9px 11px; width: 100%; min-width: 0; }
.band select option { color: var(--ink); background: var(--card); }
.band input::placeholder { color: var(--ink-3); }
.go { font-family: var(--display); font-weight: 800; font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; background: var(--orange); color: #111; border: 0; border-radius: 5px; padding: 10px 18px; cursor: pointer; }
.go:hover { background: var(--orange-2); }
.go:disabled { opacity: 0.6; cursor: default; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.msg { font-size: 14px; color: var(--ink-2); min-height: 1.5em; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.msg .err { color: var(--bad); }
.chip-sample { font-family: var(--display); font-weight: 800; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; background: var(--orange); color: #111; border-radius: 3px; padding: 1px 7px; }

.main { padding-block: 22px 48px; display: grid; gap: 22px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
h2 { font-family: var(--display); font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: 0.02em; margin: 0; line-height: 1.1; }
h3 { font-family: var(--display); font-weight: 700; font-size: 18px; text-transform: uppercase; letter-spacing: 0.03em; margin: 0; }
.muted { color: var(--ink-3); font-size: 13px; }

/* Report card */
.report { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 0; overflow: hidden; }
@media (max-width: 820px) { .report { grid-template-columns: 1fr; } }
.window { padding: 20px; display: grid; gap: 12px; align-content: start; border-right: 1px solid var(--line); }
@media (max-width: 820px) { .window { border-right: 0; border-bottom: 1px solid var(--line); } }
.team-name { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.05; text-wrap: balance; }
.verdict { display: inline-flex; align-items: center; gap: 8px; justify-self: start; font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 14px; border-radius: 4px; border: 2px solid currentColor; }
.verdict.contend { color: var(--good); background: var(--good-soft); }
.verdict.rebuild { color: var(--bad); background: var(--bad-soft); }
.verdict.retool, .verdict.rising { color: var(--warn); background: var(--warn-soft); }
.window p { margin: 0; color: var(--ink-2); max-width: 52ch; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpi { border-top: 2px solid var(--line); padding-top: 6px; min-width: 0; }
.kpi .k { font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.kpi .v { font-family: var(--mono); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--ink-3); }
.grades { padding: 20px; display: grid; gap: 14px; align-content: start; }
.grade-row { display: grid; grid-template-columns: 40px 52px 40px minmax(0, 1fr); gap: 10px; align-items: center; }
.grade-row.ghead { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); text-align: center; margin-bottom: -6px; }
.grade-row.ghead span:last-child { text-align: left; letter-spacing: 0.04em; text-transform: none; font-family: var(--body); font-weight: 400; font-size: 12px; }
.letter.sm { font-size: 18px; line-height: 1.55; opacity: 0.9; }
.srcs { display: flex; flex-wrap: wrap; gap: 6px; }
.src { font-size: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 2px 9px; color: var(--ink-2); }
.src small { color: var(--ink-3); font-size: 12px; }
.src.warn { color: var(--warn); border-color: var(--warn); }
.tag { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 3px; padding: 1px 6px; }
.tag.up { background: var(--good-soft); color: var(--good); } .tag.down { background: var(--warn-soft); color: var(--warn); }
.trend { font-family: var(--mono); font-size: 12px; } .trend.up { color: var(--good); } .trend.down { color: var(--bad); }
.side-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
tr.starter td:first-child { box-shadow: inset 3px 0 0 var(--orange); }
tr.pickrow td { color: var(--ink-2); }
.pos { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: 0.04em; }
.letter { font-family: var(--display); font-weight: 800; font-size: 26px; text-align: center; border-radius: 4px; line-height: 1.25; }
.letter.A { color: var(--good); background: var(--good-soft); }
.letter.B { color: var(--accent); background: var(--accent-soft); }
.letter.C { color: var(--warn); background: var(--warn-soft); }
.letter.D, .letter.F { color: var(--bad); background: var(--bad-soft); }
.gbar { display: grid; gap: 3px; min-width: 0; }
.track { position: relative; height: 10px; background: var(--line-2); border-radius: 5px; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--accent); }
.avgmark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-2); }
.gmeta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-3); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.gmeta b { color: var(--ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--ink-3); }
.legend i { display: inline-block; vertical-align: middle; margin-right: 5px; }
.legend .sw { width: 14px; height: 8px; border-radius: 4px; background: var(--accent); }
.legend .tk { width: 2px; height: 12px; background: var(--ink-2); }

/* Blueprint */
.plan { display: grid; gap: 14px; }
.step { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 0; overflow: hidden; }
.step-n { background: var(--card-2); border-right: 2px solid var(--orange); color: var(--orange); font-family: var(--display); font-weight: 800; font-size: 28px; display: grid; place-items: start center; padding-top: 16px; }
.step-b { padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.step-b > p { margin: 0; color: var(--ink-2); max-width: 70ch; }
.moves { display: grid; gap: 10px; }
.move { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.move-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.act { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; }
.act.add, .act.start, .act.get { background: var(--good-soft); color: var(--good); }
.act.drop, .act.bench, .act.give { background: var(--bad-soft); color: var(--bad); }
.act.with { background: var(--accent-soft); color: var(--accent); }
.pl { font-weight: 600; }
.pm { font-family: var(--mono); font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.why { font-size: 14px; color: var(--ink-2); margin: 0; }
.trade { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
@media (max-width: 560px) { .trade { grid-template-columns: 1fr; } }
.side { background: var(--bg); border-radius: 5px; padding: 8px 10px; display: grid; gap: 4px; min-width: 0; }
.empty { color: var(--ink-3); font-size: 14px; margin: 0; }
.inj { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: 0.06em; color: var(--bad); border: 1px solid currentColor; border-radius: 3px; padding: 0 4px; }

/* League board */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
td.n { font-family: var(--mono); text-align: right; }
th.n { text-align: right; }
tr.me td { background: var(--accent-soft); }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--line-2); }
tr.me.click:hover td { background: var(--accent-soft); }
.wtag { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
.wtag.contend { color: var(--good); } .wtag.rebuild { color: var(--bad); } .wtag.retool, .wtag.rising { color: var(--warn); }
.board { padding: 16px 0 4px; display: grid; gap: 10px; }
.board .sec-h { padding: 0 16px; }
.method { padding: 16px 18px; display: grid; gap: 8px; }
.method ul { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 14px; display: grid; gap: 4px; }
.loading { padding: 28px; text-align: center; color: var(--ink-3); }
</style>

<div class="band">
  <div class="in">
    <div class="brand">
      <div class="lockup">
        <div class="badge" aria-hidden="true">G<b>M</b></div>
        <h1><span class="g">Gridiron</span><span class="m">Metrics</span></h1>
      </div>
      <div>
        <div class="tool">Dynasty Blueprint</div>
        <p class="tagline">Your team graded on market consensus and real stats, plus the moves to make next.</p>
      </div>
    </div>
    <form class="connect" id="connect">
      <label class="f"><span class="lbl">Sleeper username</span><input id="user" type="text" autocomplete="off" placeholder="your_username"></label>
      <label class="f"><span class="lbl">League</span><select id="league" disabled><option>Enter a username first</option></select></label>
      <label class="f"><span class="lbl">Team to analyze</span><select id="team" disabled><option>—</option></select></label>
      <button class="go" id="go" type="submit">Find leagues</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>
</div>

<div class="main" id="out"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const POS = ["QB", "RB", "WR", "TE"];
  const FLEX_ELIG = { FLEX: ["RB","WR","TE"], SUPER_FLEX: ["QB","RB","WR","TE"], REC_FLEX: ["WR","TE"], WRRB_FLEX: ["RB","WR"] };
  const BAD_STATUS = { Out: 0, IR: 0, PUP: 0, Sus: 0, NA: 0, Doubtful: 0.3, Questionable: 0.85 };
  const ROUND = ["", "1st", "2nd", "3rd", "4th", "5th", "6th", "7th"];
  const SELL_AGE = { RB: 26, WR: 28, TE: 29, QB: 32 };

  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) { if (k === "class") e.className = attrs[k]; else if (k === "text") e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
    kids.flat().forEach((c) => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
    return e;
  }
  const f1 = (v) => (v == null || !isFinite(v)) ? "—" : v.toFixed(1);
  const f0 = (v) => (v == null || !isFinite(v)) ? "—" : String(Math.round(v));
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }
  async function getText(url) { const r = await fetch(url); if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); }
  function setMsg(...nodes) { const m = $("msg"); m.innerHTML = ""; nodes.forEach((n) => m.append(typeof n === "string" ? el("span", null, n) : n)); }
  function errMsg(t) { return el("span", { class: "err" }, t); }
  function ord(n) { const s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

  function parseCSV(t) {
    const rows = []; let row = [], f = "", q = false;
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ",") { row.push(f); f = ""; }
      else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
      else if (c !== "\r") f += c;
    }
    if (f || row.length) { row.push(f); rows.push(row); }
    const h = rows.shift() || [];
    return rows.filter((r) => r.length > 1).map((r) => { const o = {}; h.forEach((k, i) => { o[k] = r[i]; }); return o; });
  }

  // ---------------- Scoring ----------------
  function scoreStats(s, sc) {
    if (!s) return 0;
    let p = 0, used = false;
    for (const k in sc) { const v = s[k]; if (typeof v === "number" && sc[k]) { p += v * sc[k]; used = true; } }
    if (!used || p === 0) { if (typeof s.pts_ppr === "number") return s.pts_ppr; }
    return p;
  }
  // Used only when no outside value source loads, and for the example league.
  function ageMult(pos, age) {
    if (!age) return 1;
    if (pos === "RB") return age <= 24 ? 1.15 : age === 25 ? 1 : age === 26 ? 0.85 : age === 27 ? 0.7 : age === 28 ? 0.55 : 0.4;
    if (pos === "WR") return age <= 25 ? 1.15 : age <= 27 ? 1 : age === 28 ? 0.9 : age === 29 ? 0.8 : age === 30 ? 0.65 : 0.5;
    if (pos === "TE") return age <= 26 ? 1.1 : age <= 29 ? 1 : age === 30 ? 0.85 : age === 31 ? 0.7 : 0.55;
    if (pos === "QB") return age <= 28 ? 1.1 : age <= 32 ? 1 : age <= 34 ? 0.85 : age === 35 ? 0.7 : 0.55;
    return 1;
  }

  // ---------------- Outside value sources ----------------
  let dpCache = null;
  async function loadDP() {
    if (dpCache) return dpCache;
    const base = "https://raw.githubusercontent.com/dynastyprocess/data/master/files/";
    const [vt, it] = await Promise.all([getText(base + "values.csv"), getText(base + "db_playerids.csv")]);
    const fp2sl = {};
    parseCSV(it).forEach((r) => { if (r.fantasypros_id && r.sleeper_id && r.sleeper_id !== "NA") fp2sl[r.fantasypros_id] = r.sleeper_id; });
    const players = {}, picks = {}; let max1 = 0, max2 = 0, date = "";
    parseCSV(vt).forEach((r) => {
      const v1 = +r.value_1qb || 0, v2 = +r.value_2qb || 0;
      if (r.scrape_date && r.scrape_date !== "NA") date = r.scrape_date;
      if (r.pos === "PICK") { picks[r.player] = { v1, v2 }; return; }
      const sid = fp2sl[r.fp_id]; if (!sid) return;
      players[sid] = { v1, v2, ecr1: +r.ecr_1qb, ecr2: +r.ecr_2qb };
      if (v1 > max1) max1 = v1; if (v2 > max2) max2 = v2;
    });
    if (!max1) throw new Error("empty");
    return (dpCache = { players, picks, max1, max2, date });
  }
  async function loadFC(sf, teams, ppr) {
    const tryOne = async (n) => {
      const arr = await getJSON(`https://api.fantasycalc.com/values/current?isDynasty=true&numQbs=${sf ? 2 : 1}&numTeams=${n}&ppr=${ppr}`);
      const out = {}; let max = 0;
      (Array.isArray(arr) ? arr : []).forEach((x) => {
        const sid = x && x.player && x.player.sleeperId; if (!sid || !(x.value > 0)) return;
        out[String(sid)] = { v: x.value, trend: x.trend30Day || 0 }; if (x.value > max) max = x.value;
      });
      if (!max) throw new Error("empty");
      return { players: out, max };
    };
    try { return await tryOne(teams); } catch (e) { if (teams !== 12) { try { return await tryOne(12); } catch (e2) {} } return null; }
  }

  function applyValues(Lg, dp, fc) {
    Lg.dp = dp; Lg.sources = [];
    if (dp) Lg.sources.push({ key: "dp", name: "FantasyPros expert consensus", via: "DynastyProcess", note: "updated " + dp.date });
    if (fc) Lg.sources.push({ key: "fc", name: "FantasyCalc trade market", via: "FantasyCalc", note: "live" });
    const sf = Lg.sf;
    Object.values(Lg.players).forEach((p) => {
      p.src = {}; const parts = [];
      if (dp && dp.players[p.id]) { const d = dp.players[p.id]; p.src.dp = 100 * (sf ? d.v2 : d.v1) / (sf ? dp.max2 : dp.max1); p.ecr = sf ? d.ecr2 : d.ecr1; parts.push(p.src.dp); }
      if (fc && fc.players[p.id]) { const c = fc.players[p.id]; p.src.fc = 100 * c.v / fc.max; p.trend = c.v ? c.trend / c.v : 0; parts.push(p.src.fc); }
      p.val = parts.length ? parts.reduce((a, c) => a + c, 0) / parts.length : 0;
    });
    Lg.statsOnly = !dp && !fc;
  }

  // ---------------- Data loading (Sleeper) ----------------
  let state = null, allPlayers = null, me = null, leagues = [];
  async function nflState() { if (!state) { try { state = await getJSON("https://api.sleeper.app/v1/state/nfl"); } catch (e) { state = { season: "2026", week: 10 }; } } return state; }
  async function playersDB() {
    if (!allPlayers) allPlayers = getJSON("https://api.sleeper.app/v1/players/nfl").catch((e) => { allPlayers = null; throw e; });
    return allPlayers;
  }
  const POSQ = POS.map((p) => "position[]=" + p).join("&");
  async function feed(kind, season, week) {
    const path = kind === "stats" ? `stats/nfl/${season}` : `projections/nfl/${season}/${week}`;
    try {
      const arr = await getJSON(`https://api.sleeper.com/${path}?season_type=regular&${POSQ}`);
      const out = {}; (Array.isArray(arr) ? arr : []).forEach((r) => { if (r && r.player_id && r.stats) out[r.player_id] = r.stats; });
      if (Object.keys(out).length) return out;
      throw new Error("empty");
    } catch (e) {
      try { return await getJSON(kind === "stats" ? `https://api.sleeper.app/v1/stats/nfl/regular/${season}` : `https://api.sleeper.app/v1/projections/nfl/regular/${season}/${week}`); }
      catch (e2) { return kind === "stats" ? {} : null; }
    }
  }

  function buildPicks(Lg, traded, rounds) {
    const S = parseInt(Lg.season, 10), years = [S + 1, S + 2, S + 3];
    const own = {};
    Lg.teams.forEach((t) => years.forEach((y) => { for (let r = 1; r <= rounds; r++) own[`${y}-${r}-${t.id}`] = t.id; }));
    (traded || []).forEach((tp) => { const k = `${tp.season}-${tp.round}-${tp.roster_id}`; if (k in own) own[k] = String(tp.owner_id); });
    Lg.teams.forEach((t) => { t.picks = []; });
    for (const k in own) {
      const [y, r, orig] = k.split("-");
      const owner = Lg.teams.find((t) => t.id === own[k]); if (!owner) continue;
      owner.picks.push({ kind: "pick", id: "pk" + k, season: +y, round: +r, orig, val: 0, label: "" });
    }
  }

  async function loadLeague(lg) {
    const st = await nflState();
    const season = String(lg.season);
    const week = String(st.season) === season ? Math.max(1, parseInt(st.display_week || st.week, 10) || 1) : 1;
    const league = await getJSON(`https://api.sleeper.app/v1/league/${lg.league_id}`);
    const sc = league.scoring_settings || {};
    const sf = (league.roster_positions || []).includes("SUPER_FLEX") || (league.roster_positions || []).filter((s) => s === "QB").length > 1;
    const rec = sc.rec || 0;
    const pprParam = rec >= 1 ? 1 : rec >= 0.5 ? 0.5 : 0;
    const nTeams = league.total_rosters || 12;
    const inSeason = String(st.season) === season && (st.season_type === "regular" || !st.season_type);
    const [rosters, users, traded, db, cur, prev, proj, dp, fc] = await Promise.all([
      getJSON(`https://api.sleeper.app/v1/league/${lg.league_id}/rosters`),
      getJSON(`https://api.sleeper.app/v1/league/${lg.league_id}/users`),
      getJSON(`https://api.sleeper.app/v1/league/${lg.league_id}/traded_picks`).catch(() => []),
      playersDB(),
      feed("stats", season),
      feed("stats", String(parseInt(season, 10) - 1)),
      inSeason ? feed("proj", season, week) : Promise.resolve(null),
      loadDP().catch(() => null),
      loadFC(sf, nTeams, pprParam),
    ]);
    const umap = {}; users.forEach((u) => { umap[u.user_id] = u; });
    const rostered = new Set();
    const teams = rosters.map((r) => {
      const u = umap[r.owner_id] || {};
      const ids = (r.players || []).filter(Boolean);
      ids.forEach((id) => rostered.add(id));
      const s = r.settings || {};
      return {
        id: String(r.roster_id), ownerId: r.owner_id,
        name: (u.metadata && u.metadata.team_name) || u.display_name || ("Team " + r.roster_id),
        owner: u.display_name || "",
        wins: s.wins || 0, losses: s.losses || 0, ties: s.ties || 0,
        pf: (s.fpts || 0) + (s.fpts_decimal || 0) / 100,
        ids, starters: (r.starters || []).filter((x) => x && x !== "0"), taxi: new Set(r.taxi || []), reserve: new Set(r.reserve || []),
      };
    });
    const players = {};
    const mk = (id) => {
      const p = db[id]; if (!p || !POS.includes(p.position)) return null;
      const s = cur[id], ps = prev[id];
      const gp = (s && (s.gp || s.gms_active)) || 0;
      const pts = scoreStats(s, sc), ppts = scoreStats(ps, sc);
      const pgp = (ps && (ps.gp || ps.gms_active)) || 0;
      let ppg = gp > 0 ? pts / gp : 0;
      if (gp < 3 && pgp >= 4) { const pp = ppts / pgp; ppg = gp > 0 ? (pts + pp * 3) / (gp + 3) : pp * 0.9; }
      const pr = proj && proj[id] ? scoreStats(proj[id], sc) : null;
      return { id, name: p.full_name || ((p.first_name || "") + " " + (p.last_name || "")).trim(), pos: p.position, nfl: p.team || "FA", age: p.age || null, inj: p.injury_status || null, gp, ppg, proj: pr, active: !!p.active };
    };
    rostered.forEach((id) => { const p = mk(id); if (p) players[id] = p; });
    const fa = [];
    const faIds = new Set(Object.keys(cur));
    if (dp) Object.keys(dp.players).forEach((id) => faIds.add(id));
    faIds.forEach((id) => {
      if (rostered.has(id)) return;
      const p = mk(id); if (!p || !p.active || p.nfl === "FA") return;
      if (p.gp >= 2 || p.ppg > 0 || (dp && dp.players[id])) { players[id] = p; fa.push(id); }
    });
    const fmt = [sf ? "Superflex" : "1QB", rec === 1 ? "PPR" : rec === 0.5 ? "Half PPR" : rec === 0 ? "Standard" : rec + " PPR", (sc.bonus_rec_te ? "TE premium" : null)].filter(Boolean).join(" · ");
    const type = league.settings && league.settings.type;
    const Lg = {
      name: league.name, season, week, slots: league.roster_positions || [], teams, players, fa, hasProj: !!proj, sf,
      fmt, isDynasty: type === 2, typeLabel: type === 2 ? "Dynasty" : type === 1 ? "Keeper" : "Redraft",
    };
    applyValues(Lg, dp, fc);
    buildPicks(Lg, traded, Math.min(5, (league.settings && league.settings.draft_rounds) || 4));
    return Lg;
  }

  // ---------------- Analysis ----------------
  let L = null, myTeamId = null;
  function starterSlots(slots) { return slots.filter((s) => POS.includes(s) || FLEX_ELIG[s]); }
  function optimalLineup(ids, slots, metric) {
    const avail = ids.slice().sort((a, b) => metric(b) - metric(a));
    const used = new Set(), lineup = [];
    const order = ["QB","TE","RB","WR","REC_FLEX","WRRB_FLEX","FLEX","SUPER_FLEX"];
    const ss = starterSlots(slots).slice().sort((a, b) => order.indexOf(a) - order.indexOf(b));
    for (const s of ss) {
      const elig = POS.includes(s) ? [s] : FLEX_ELIG[s];
      const pick = avail.find((id) => !used.has(id) && elig.includes(L.players[id].pos));
      if (pick) { used.add(pick); lineup.push({ slot: s, id: pick }); } else lineup.push({ slot: s, id: null });
    }
    return lineup;
  }
  function letterFor(rank, N) { const pct = N > 1 ? (rank - 1) / (N - 1) : 0; return pct <= 0.15 ? "A" : pct <= 0.4 ? "B" : pct <= 0.65 ? "C" : pct <= 0.85 ? "D" : "F"; }

  function priceAssets(Lg) {
    const S = parseInt(Lg.season, 10), N = Lg.teams.length, third = Math.max(1, Math.ceil(N / 3));
    const dp = Lg.dp, sf = Lg.sf, max = dp ? (sf ? dp.max2 : dp.max1) : 10000;
    const look = (name) => (dp && dp.picks[name]) ? 100 * (sf ? dp.picks[name].v2 : dp.picks[name].v1) / max : null;
    Lg.teams.forEach((t) => t.picks.forEach((pk) => {
      const orig = Lg.teams.find((x) => x.id === pk.orig);
      const rk = orig ? orig.nowRank : Math.ceil(N / 2);
      const tier = rk > N - third ? "Early" : rk <= third ? "Late" : "Mid";
      const rn = ROUND[pk.round] || pk.round + "th";
      let v = null;
      if (pk.season === S + 1) { v = look(`${pk.season} ${tier} ${rn}`); if (v == null) v = look(`${pk.season} ${rn}`); }
      else if (pk.season === S + 2) v = look(`${pk.season} ${rn}`);
      else { const b = look(`${S + 2} ${rn}`); v = b == null ? null : b * 0.85; }
      if (v == null && Lg.statsOnly) v = [0, 18, 6, 2, 1, 0.5][pk.round] || 0;
      pk.val = v || 0;
      pk.label = `${pk.season}${pk.season === S + 1 ? " " + tier.toLowerCase() : ""} ${rn}` + (orig && orig.id !== t.id ? ` (from ${orig.name})` : "");
    }));
  }

  function analyze(Lg) {
    const slots = Lg.slots, ss = starterSlots(slots), N = Lg.teams.length;
    const ded = {}; POS.forEach((p) => { ded[p] = ss.filter((s) => s === p).length; });
    const flexN = ss.filter((s) => FLEX_ELIG[s]).length, sfN = ss.filter((s) => s === "SUPER_FLEX").length;
    const kPos = { QB: Math.max(1, ded.QB + sfN), RB: ded.RB + (flexN - sfN > 0 ? 1 : 0), WR: ded.WR + (flexN - sfN > 0 ? 1 : 0), TE: Math.max(1, ded.TE) };
    const repl = {};
    POS.forEach((P) => {
      const all = Object.values(Lg.players).filter((p) => p.pos === P).map((p) => p.ppg).sort((a, b) => b - a);
      repl[P] = all[Math.min(all.length - 1, N * kPos[P])] || 0;
    });
    if (Lg.statsOnly) Object.values(Lg.players).forEach((p) => { p.val = Math.min(100, 4 * Math.max(0, p.ppg - repl[p.pos]) * ageMult(p.pos, p.age) + (p.age && p.age <= 23 ? 3 : 0)); p.src = p.src || {}; });
    const ppgM = (id) => Lg.players[id].ppg;
    Lg.teams.forEach((t) => {
      t.pids = t.ids.filter((id) => Lg.players[id]);
      t.active = t.pids.filter((id) => !t.taxi.has(id));
      t.best = optimalLineup(t.active, slots, ppgM);
      t.bestIds = new Set(t.best.map((x) => x.id).filter(Boolean));
      t.lineupPPG = t.best.reduce((s, x) => s + (x.id ? Lg.players[x.id].ppg : 0), 0);
      const ages = t.best.map((x) => x.id && Lg.players[x.id].age).filter(Boolean);
      t.avgAge = ages.length ? ages.reduce((a, c) => a + c, 0) / ages.length : null;
    });
    Lg.teams.slice().sort((a, b) => b.lineupPPG - a.lineupPPG).forEach((t, i) => { t.nowRank = i + 1; });
    priceAssets(Lg);
    Lg.teams.forEach((t) => {
      t.playerVal = t.pids.reduce((s, id) => s + Lg.players[id].val, 0);
      t.pickVal = t.picks.reduce((s, p) => s + p.val, 0);
      t.dynVal = t.playerVal + t.pickVal;
      t.posNow = {}; t.posDyn = {};
      POS.forEach((P) => {
        const mine = t.pids.filter((id) => Lg.players[id].pos === P);
        t.posNow[P] = mine.map((id) => Lg.players[id].ppg).sort((a, b) => b - a).slice(0, kPos[P]).reduce((a, c) => a + c, 0);
        t.posDyn[P] = mine.map((id) => Lg.players[id].val).sort((a, b) => b - a).slice(0, kPos[P] + 1).reduce((a, c) => a + c, 0);
      });
    });
    Lg.teams.slice().sort((a, b) => b.dynVal - a.dynVal).forEach((t, i) => { t.dynRank = i + 1; });
    const ageVals = Lg.teams.map((t) => t.avgAge).filter(Boolean);
    Lg.leagueAge = ageVals.reduce((a, c) => a + c, 0) / (ageVals.length || 1);
    const third = Math.max(1, Math.ceil(N / 3));
    Lg.teams.forEach((t) => {
      if (t.nowRank <= third) t.window = "contend";
      else if (t.dynRank <= third) t.window = "rising";
      else if (t.nowRank > N - third && t.dynRank > N / 2) t.window = "rebuild";
      else t.window = "retool";
      t.grade = {};
      POS.forEach((P) => {
        const nowSorted = Lg.teams.map((x) => x.posNow[P]).sort((a, b) => b - a);
        const dynSorted = Lg.teams.map((x) => x.posDyn[P]).sort((a, b) => b - a);
        const nr = nowSorted.indexOf(t.posNow[P]) + 1, dr = dynSorted.indexOf(t.posDyn[P]) + 1;
        t.grade[P] = {
          now: { rank: nr, letter: letterFor(nr, N), score: t.posNow[P] },
          dyn: { rank: dr, letter: letterFor(dr, N), score: t.posDyn[P], max: dynSorted[0], avg: dynSorted.reduce((a, c) => a + c, 0) / N },
        };
      });
    });
    // Market vs production, by position, among players with real samples
    POS.forEach((P) => {
      const pool = Object.values(Lg.players).filter((p) => p.pos === P && p.gp >= 3);
      pool.slice().sort((a, b) => b.val - a.val).forEach((p, i) => { p.valRank = i + 1; });
      pool.slice().sort((a, b) => b.ppg - a.ppg).forEach((p, i) => { p.ppgRank = i + 1; });
    });
    Lg.repl = repl; Lg.kPos = kPos;
  }

  // ---------------- Blueprint ----------------
  function packageFor(target, pool) {
    const items = pool.filter((a) => a.val >= 1).sort((a, b) => b.val - a.val).slice(0, 16);
    let best = null;
    const consider = (combo) => {
      const s = combo.reduce((x, c) => x + c.val, 0), n = combo.length;
      const lo = target * (n === 1 ? 0.92 : n === 2 ? 1.05 : 1.12), hi = target * (n === 1 ? 1.2 : 1.35);
      if (s < lo || s > hi) return;
      const over = s - lo;
      if (!best || n < best.n || (n === best.n && over < best.over)) best = { combo, sum: s, n, over };
    };
    for (let i = 0; i < items.length; i++) {
      consider([items[i]]);
      for (let j = i + 1; j < items.length; j++) {
        consider([items[i], items[j]]);
        for (let k = j + 1; k < items.length; k++) consider([items[i], items[j], items[k]]);
      }
    }
    return best;
  }

  function blueprint(Lg, t) {
    const P = (id) => Lg.players[id];
    const N = Lg.teams.length;
    const others = Lg.teams.filter((x) => x.id !== t.id);
    const bench = t.active.filter((id) => !t.bestIds.has(id));
    const playable = (p) => !(p.inj && BAD_STATUS[p.inj] === 0);
    const contend = t.window === "contend";
    const nowWeak = POS.slice().sort((a, b) => t.grade[b].now.rank - t.grade[a].now.rank);
    const dynWeak = POS.slice().sort((a, b) => t.grade[b].dyn.rank - t.grade[a].dyn.rank);

    // 1. Lineup
    const metric = (id) => { const p = P(id); const base = (Lg.hasProj && p.proj != null) ? p.proj : p.ppg; const m = p.inj && BAD_STATUS[p.inj] != null ? BAD_STATUS[p.inj] : 1; return base * m; };
    const opt = optimalLineup(t.active, Lg.slots, metric);
    const optIds = new Set(opt.map((x) => x.id).filter(Boolean));
    const curIds = new Set(t.starters.filter((id) => P(id)));
    const ins = [...optIds].filter((id) => !curIds.has(id)).sort((a, b) => metric(b) - metric(a));
    const outs = [...curIds].filter((id) => !optIds.has(id)).sort((a, b) => metric(a) - metric(b));
    const lineup = [];
    for (let i = 0; i < Math.max(ins.length, outs.length); i++) lineup.push({ start: ins[i] || null, bench: outs[i] || null });

    // 2. Waivers + cuts share one "keep" score: market value, plus current production for contenders
    const keep = (id) => { const p = P(id); return contend ? p.val + p.ppg * 0.8 : p.val + p.ppg * 0.25 + (p.age && p.age <= 23 ? 3 : 0); };
    const dropPool = bench.filter((id) => !t.reserve.has(id)).sort((a, b) => keep(a) - keep(b));
    const usedDrops = new Set(), adds = [];
    (contend ? nowWeak : dynWeak).slice(0, 2).concat(POS).forEach((pos) => {
      if (adds.length >= 3) return;
      Lg.fa.filter((id) => P(id).pos === pos && playable(P(id)) && !adds.some((a) => a.id === id))
        .sort((a, b) => keep(b) - keep(a)).slice(0, 2).forEach((id) => {
          if (adds.length >= 3) return;
          const drop = dropPool.find((d) => !usedDrops.has(d));
          if (!drop || keep(id) < keep(drop) + 1.5) return;
          usedDrops.add(drop); adds.push({ id, pos, drop });
        });
    });
    const cuts = dropPool.filter((id) => !usedDrops.has(id) && P(id).val < 4 && P(id).ppg < Lg.repl[P(id).pos] && !(P(id).age && P(id).age <= 22)).slice(0, 3);

    // 3. Trades, priced on consensus value
    const trades = [];
    const asPlayer = (id) => ({ kind: "player", id, val: P(id).val });
    const usedMine = new Set();
    const buy = (posList, filterTarget, myPool, limit) => {
      for (const pos of posList) {
        if (trades.length >= limit) return;
        const mineAtPos = t.best.filter((x) => x.id && P(x.id).pos === pos).map((x) => P(x.id).ppg);
        const myWorst = mineAtPos.length ? Math.min(...mineAtPos) : 0;
        const cands = [];
        others.forEach((o) => o.pids.forEach((id) => {
          const p = P(id); if (p.pos !== pos || !playable(p) || p.val < 3) return;
          if (p.ppg < myWorst + 2) return;
          if (o.window === "contend" && o.bestIds.has(id)) return; // contenders won't sell starters
          if (filterTarget && !filterTarget(p)) return;
          cands.push({ o, id, gain: p.ppg - myWorst });
        }));
        cands.sort((a, b) => b.gain / (P(b.id).val + 8) - a.gain / (P(a.id).val + 8));
        for (const c of cands.slice(0, 8)) {
          const pkg = packageFor(P(c.id).val, myPool.filter((a) => !usedMine.has(a.id)));
          if (!pkg) continue;
          pkg.combo.forEach((a) => usedMine.add(a.id));
          const why = (c.o.bestIds.has(c.id) ? `${c.o.name} is ${winWord(c.o.window)}, so a producing vet is worth more to you than to them. ` : `He's on ${c.o.name}'s bench, so they can spare him. `) +
            `He adds about ${f1(c.gain)} PPG over your weakest starting ${pos}.`;
          trades.push({ partner: c.o, get: [asPlayer(c.id)], give: pkg.combo, getVal: P(c.id).val, giveVal: pkg.sum, why });
          break;
        }
      }
    };
    const sell = (limit) => {
      const sellers = t.pids.filter((id) => { const p = P(id); return p.val >= 10 && p.age && p.age >= SELL_AGE[p.pos]; }).sort((a, b) => P(b).val - P(a).val);
      for (const sid of sellers) {
        if (trades.length >= limit) return;
        const s = P(sid);
        const buyers = others.filter((o) => o.window === "contend" || o.window === "retool").sort((a, b) => b.grade[s.pos].now.rank - a.grade[s.pos].now.rank);
        for (const b of buyers) {
          const pool = b.picks.concat(b.pids.filter((id) => !b.bestIds.has(id) && P(id).age && P(id).age <= 25).map(asPlayer));
          const pkg = packageFor(s.val, pool);
          if (!pkg) continue;
          trades.push({ partner: b, get: pkg.combo, give: [asPlayer(sid)], getVal: pkg.sum, giveVal: s.val,
            why: `${s.name} is ${s.age}, past the age where ${s.pos} values usually start dropping. ${b.name} is ${winWord(b.window)} and ranks ${ord(b.grade[s.pos].now.rank)} of ${N} at ${s.pos} right now, so he fills a real need for them.` });
          break;
        }
      }
    };
    const benchPool = bench.map(asPlayer).concat(t.picks);
    if (t.window === "contend") buy(nowWeak.slice(0, 3), null, benchPool, 3);
    else if (t.window === "rebuild") sell(3);
    else if (t.window === "rising") buy(dynWeak.slice(0, 3), (p) => p.age && p.age <= 26, bench.filter((id) => !(P(id).age && P(id).age <= 24)).map(asPlayer).concat(t.picks.filter((pk) => pk.round >= 2)), 2);
    else { sell(1); buy(nowWeak.slice(0, 2), (p) => p.age && p.age <= 27, benchPool, 3); }

    return { lineup, adds, cuts, trades, nowWeak, dynWeak };
  }
  function winWord(w) { return w === "contend" ? "contending" : w === "rebuild" ? "rebuilding" : w === "rising" ? "building up" : "in the middle of the pack"; }

  // ---------------- Render ----------------
  const WIN = {
    contend: ["Contend", "Your starting lineup ranks in the top third right now. Push chips in: turn bench depth and picks into points at your weak spots."],
    rising: ["Rising", "Not a top lineup yet, but your roster holds a lot of market value. Keep the young core, and only buy production that's cheap."],
    retool: ["Retool", "Stuck in the middle. Sell aging pieces while the market still pays for them, and buy younger producers at your weakest spots."],
    rebuild: ["Rebuild", "The lineup isn't close to the top and the roster value is low. Sell veterans for young players and picks while they still score."],
  };
  function plRow(id) {
    const p = L.players[id]; if (!p) return el("span", { class: "pm" }, "—");
    return el("span", null, el("span", { class: "pl" }, p.name), " ",
      el("span", { class: "pm" }, `${p.pos} · ${p.nfl}${p.age ? " · " + p.age : ""} · ${f1(p.ppg)} PPG · value ${f0(p.val)}`),
      p.inj ? [" ", el("span", { class: "inj" }, p.inj.toUpperCase())] : null);
  }
  function assetRow(a) {
    if (a.kind === "pick") return el("span", null, el("span", { class: "pl" }, a.label), " ", el("span", { class: "pm" }, "pick · value " + f0(a.val)));
    return plRow(a.id);
  }
  function tagFor(p) {
    if (!p.valRank || !p.ppgRank) return null;
    const d = p.valRank - p.ppgRank;
    if (d >= 12) return el("span", { class: "tag up" }, "Outplaying value");
    if (d <= -12 && p.age && p.age >= 25) return el("span", { class: "tag down" }, "Value ahead of output");
    return null;
  }

  function render() {
    const out = $("out"); out.innerHTML = "";
    const t = L.teams.find((x) => x.id === myTeamId) || L.teams[0];
    const bp = blueprint(L, t);
    const N = L.teams.length;
    const [wLabel, wText] = WIN[t.window];
    const rec = `${t.wins}-${t.losses}${t.ties ? "-" + t.ties : ""}`;

    const srcLine = el("div", { class: "srcs" },
      L.sample ? el("span", { class: "src" }, "Example values") :
      L.statsOnly ? el("span", { class: "src warn" }, "Outside values didn't load, using a stats-only estimate") :
      L.sources.map((s) => el("span", { class: "src" }, s.name, el("small", null, " · " + s.note))));

    const win = el("div", { class: "window" },
      el("div", { class: "muted" }, `${L.name} · ${L.season} · ${L.typeLabel} · ${L.fmt}`),
      el("div", { class: "team-name" }, t.name),
      el("div", { class: "verdict " + t.window }, wLabel),

  // ---------------- Example league (fictional) ----------------
  function sampleLeague() {
    let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const first = ["Marcus","Tyrell","Dante","Cole","Jalen","Brock","Isaiah","Reggie","Mason","Darius","Trent","Elijah","Quinn","Andre","Malik","Corey","Devin","Nate","Luke","Jordan","Rashad","Bryce","Caleb","Jamal","Owen"];
    const last = ["Hale","Okafor","Brandt","Whitfield","Mercer","Castillo","Pruitt","Lindqvist","Bowers","Sutton","Ferreira","Tolliver","Graves","Ashby","Kincaid","Roby","Delacroix","Strand","Mabry","Vance","Ochoa","Pickett","Rowan","Talley","Wendt"];
    const nfl = ["NYJ","KC","DET","SF","BUF","CIN","MIA","PHI","BAL","GB","LAR","SEA","DAL","HOU","ATL","CHI"];
    const shape = { QB: [13, 24], RB: [6, 21], WR: [6, 22], TE: [4, 15] };
    const ageR = { QB: [23, 37], RB: [21, 30], WR: [21, 32], TE: [22, 33] };
    const players = {}; let n = 0; const used = new Set();
    const make = (pos, scale) => {
      let name; do { name = first[Math.floor(rnd() * first.length)] + " " + last[Math.floor(rnd() * last.length)]; } while (used.has(name)); used.add(name);
      const [lo, hi] = ageR[pos]; const age = Math.round(lo + (hi - lo) * Math.pow(rnd(), 1.3));
      const [mn, mx] = shape[pos]; const ppg = Math.max(1, (mn + (mx - mn) * Math.pow(rnd(), 1.6) * ageMult(pos, age) / 1.1) * (scale || 1));
      const base = Math.max(0, (ppg - mn) * 5 * ageMult(pos, age)) * (pos === "QB" ? 1.4 : 1) + (age <= 23 ? 6 : 0);
      const dpv = Math.min(100, base * (0.85 + rnd() * 0.3)), fcv = Math.min(100, base * (0.85 + rnd() * 0.3));
      const id = "s" + (++n);
      const inj = rnd() < 0.06 ? (rnd() < 0.5 ? "Questionable" : "Out") : null;
      players[id] = { id, name, pos, nfl: nfl[Math.floor(rnd() * nfl.length)], age, inj, gp: 7 + Math.floor(rnd() * 3), ppg, proj: ppg * (0.8 + rnd() * 0.4), active: true,
        src: { dp: dpv, fc: fcv }, val: (dpv + fcv) / 2, trend: (rnd() - 0.5) * 0.2 };
      return id;
    };
    const slots = ["QB","RB","RB","WR","WR","WR","TE","FLEX","SUPER_FLEX", ...Array(14).fill("BN")];
    const names = ["Example Squad","Gridiron Alchemists","Fourth & Long Shots","The Taxi Squad","Waiver Wire Bandits","Dynasty Dreamers","Run It Back","Hail Mary Holdings","Red Zone Regulars","Bench Mob"];
    const teams = names.map((nm, i) => {
      const ids = [];
      [["QB",3],["RB",6],["WR",8],["TE",3]].forEach(([p, c]) => { for (let k = 0; k < c; k++) ids.push(make(p)); });
      const w = Math.floor(rnd() * 9);
      return { id: String(i + 1), name: nm, owner: "", wins: w, losses: 9 - w, ties: 0, pf: 900 + rnd() * 350, ids, starters: [], taxi: new Set(), reserve: new Set() };
    });
    const fa = []; [["QB",6],["RB",14],["WR",16],["TE",8]].forEach(([p, c]) => { for (let k = 0; k < c; k++) { const id = make(p, 0.6); players[id].val *= 0.5; fa.push(id); } });
    const pk = (a, b) => ({ v1: a, v2: b });
    const dp = { max1: 10000, max2: 10000, players: {}, date: "", picks: {
      "2027 Early 1st": pk(4386, 5220), "2027 Mid 1st": pk(1985, 2317), "2027 Late 1st": pk(928, 1086), "2028 1st": pk(1605, 1888),
      "2027 Early 2nd": pk(457, 537), "2027 Mid 2nd": pk(237, 280), "2027 Late 2nd": pk(129, 153), "2028 2nd": pk(192, 227),
      "2027 Early 3rd": pk(73, 88), "2027 Mid 3rd": pk(44, 53), "2027 Late 3rd": pk(27, 34), "2028 3rd": pk(35, 43),
      "2027 Early 4th": pk(18, 23), "2027 Mid 4th": pk(12, 16), "2027 Late 4th": pk(9, 12), "2028 4th": pk(10, 13) } };
    const Lg = { name: "Example League", season: "2026", week: 10, slots, teams, players, fa, hasProj: true, fmt: "Superflex · PPR", isDynasty: true, typeLabel: "Dynasty", sample: true, sf: true, dp, sources: [], statsOnly: false };
    L = Lg;
    buildPicks(Lg, [{ season: "2027", round: 1, roster_id: "4", owner_id: "1" }, { season: "2027", round: 2, roster_id: "1", owner_id: "6" }], 4);
    teams.forEach((t) => {
      const lu = optimalLineup(t.ids, slots, (id) => players[id].ppg);
      t.starters = lu.map((x) => x.id).filter(Boolean);
      const benchRB = t.ids.find((id) => players[id].pos === "RB" && !t.starters.includes(id));
      const i = t.starters.findIndex((id) => players[id].pos === "RB");
      if (benchRB && i >= 0 && rnd() < 0.6) t.starters[i] = benchRB;
    });
    return Lg;
  }

  // ---------------- Wiring ----------------
  function useLeague(Lg, teamId) {
    L = Lg; analyze(L);
    myTeamId = teamId || L.teams[0].id;
    const sel = $("team"); sel.innerHTML = "";
    L.teams.forEach((t) => sel.append(el("option", { value: t.id }, t.name + (t.owner ? " (" + t.owner + ")" : ""))));
    sel.value = myTeamId; sel.disabled = false;
    render();
  }

  $("connect").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = $("user").value.trim();
    if (!name) { setMsg(errMsg("Enter your Sleeper username.")); return; }
    $("go").disabled = true;
    setMsg("Looking up " + name + "…");
    try {
      me = await getJSON("https://api.sleeper.app/v1/user/" + encodeURIComponent(name));
      if (!me || !me.user_id) throw new Error("notfound");
      store.set("fob_user", name);
      const st = await nflState();
      const season = String(st.league_season || st.season || "2026");
      let ls = await getJSON(`https://api.sleeper.app/v1/user/${me.user_id}/leagues/nfl/${season}`);
      if (!ls.length) ls = await getJSON(`https://api.sleeper.app/v1/user/${me.user_id}/leagues/nfl/${parseInt(season, 10) - 1}`);
      leagues = ls.sort((a, b) => ((b.settings && b.settings.type) === 2) - ((a.settings && a.settings.type) === 2));
      const sel = $("league"); sel.innerHTML = "";
      if (!leagues.length) { sel.append(el("option", null, "No leagues found")); sel.disabled = true; setMsg(errMsg("No " + season + " leagues found for " + name + ".")); return; }
      leagues.forEach((l) => sel.append(el("option", { value: l.league_id }, l.name + " · " + ((l.settings && l.settings.type) === 2 ? "Dynasty" : (l.settings && l.settings.type) === 1 ? "Keeper" : "Redraft"))));
      sel.disabled = false;
      await openLeague(leagues[0].league_id);
    } catch (err) {
      setMsg(errMsg(err.message === "notfound" ? `No Sleeper user named "${name}". Check the spelling.` : "Couldn't reach Sleeper (" + err.message + "). Check your connection and try again."));
    } finally { $("go").disabled = false; }
  });
  $("league").addEventListener("change", () => openLeague($("league").value));
  $("team").addEventListener("change", () => { myTeamId = $("team").value; render(); });

  async function openLeague(id) {
    const lg = leagues.find((l) => l.league_id === id); if (!lg) return;
    setMsg("Loading " + lg.name + ": rosters, stats, projections and market values. The first load takes a few seconds…");
    $("out").innerHTML = ""; $("out").append(el("div", { class: "card loading" }, "Crunching the numbers…"));
    try {
      const Lg = await loadLeague(lg);
      const mine = Lg.teams.find((t) => t.ownerId === me.user_id);
      useLeague(Lg, mine && mine.id);
      const notes = [L.name + " · " + L.teams.length + " teams · " + L.fmt];
      if (L.sources.length === 1) notes.push(errMsg(L.sources[0].via === "DynastyProcess" ? "FantasyCalc didn't load, so values use FantasyPros consensus only." : "FantasyPros consensus didn't load, so values use FantasyCalc only."));
      if (L.statsOnly) notes.push(errMsg("Neither value source loaded, so grades use a stats-only estimate. Try reloading."));
      if (!L.isDynasty) notes.push(errMsg("This is a " + L.typeLabel.toLowerCase() + " league. The blueprint is tuned for dynasty."));
      setMsg(...notes);
    } catch (err) {
      setMsg(errMsg("Couldn't load that league (" + err.message + "). Try again, or pick another league."));
      $("out").innerHTML = "";
    }
  }

  const saved = store.get("fob_user"); if (saved) $("user").value = saved;
  useLeague(sampleLeague(), "1");
  setMsg(el("span", { class: "chip-sample" }, "Example"), "A made-up league with invented players. Enter your Sleeper username to load yours.");
})();
