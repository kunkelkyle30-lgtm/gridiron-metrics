<title>Gridiron Metrics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: Gridiron Metrics brand, committed dark like the helmet logo. Header band with GM badge and helmet stripe, then report card, blueprint steps, league board. */
:root {
  --bg: #0B0C0E;
  --card: #15171B;
  --card-2: #1C1F24;
  --ink: #F2F3F5;
  --ink-2: #B4B9C2;
  --ink-3: #828894;
  --line: #2A2E35;
  --line-2: #22252B;
  --navy: #101114;
  --orange: #F26A21;
  --orange-2: #FF8A47;
  --accent: #F26A21;
  --accent-soft: #3A2216;
  --chrome: #C9CDD3;
  --good: #5FD08F; --good-soft: #15301F;
  --warn: #F2B544; --warn-soft: #382A10;
  --bad: #FF7A6B;  --bad-soft: #3B1A16;
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; margin: 0; }
.band { background: radial-gradient(120% 140% at 85% 0%, #23262C 0%, var(--navy) 55%); color: var(--ink); position: relative; border-bottom: 1px solid var(--line); }
.band::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 6px; background: linear-gradient(90deg, transparent 0 calc(50% - 22px), #fff calc(50% - 22px) calc(50% - 16px), var(--orange) calc(50% - 16px) calc(50% + 16px), #fff calc(50% + 16px) calc(50% + 22px), transparent calc(50% + 22px)); }
.band .in, .main {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.band .in { padding-block: 22px 22px; display: grid; gap: 16px; }
.brand { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
.lockup { display: flex; align-items: center; gap: 14px; }
.badge { width: 52px; height: 52px; flex: none; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #3A3E45, #0D0E10 70%); border: 2px solid var(--chrome); box-shadow: 0 0 0 3px var(--navy), 0 0 0 4px var(--orange); font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: -0.02em; color: #fff; }
.badge b { color: var(--orange); font-weight: 900; }
h1 { margin: 0; line-height: 0.9; display: grid; }
h1 .g { font-family: var(--display); font-weight: 900; font-size: 36px; letter-spacing: 0.02em; text-transform: uppercase; color: #fff; }
h1 .m { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 0.55em; text-transform: uppercase; color: var(--orange); padding-left: 2px; }
.tagline { color: var(--ink-2); margin: 0; font-size: 15px; max-width: 44ch; }
.tool { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--chrome); }
.connect { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.4fr) minmax(0, 1.4fr) auto; gap: 10px; align-items: end; }
@media (max-width: 800px) { .connect { grid-template-columns: 1fr 1fr; } .connect .go { grid-column: 1 / -1; } }
@media (max-width: 460px) { .connect { grid-template-columns: 1fr; } }
.f { display: grid; gap: 4px; min-width: 0; }
.lbl { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
.band input, .band select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 5px; padding: 9px 11px; width: 100%; min-width: 0; }
.band select option { color: var(--ink); background: var(--card); }
.band input::placeholder { color: var(--ink-3); }
.go { font-family: var(--display); font-weight: 800; font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; background: var(--orange); color: #111; border: 0; border-radius: 5px; padding: 10px 18px; cursor: pointer; }
.go:hover { background: var(--orange-2); }
.go:disabled { opacity: 0.6; cursor: default; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.msg { font-size: 14px; color: var(--ink-2); min-height: 1.5em; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.msg .err { color: var(--bad); }
.chip-sample { font-family: var(--display); font-weight: 800; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; background: var(--orange); color: #111; border-radius: 3px; padding: 1px 7px; }

.main { padding-block: 22px 48px; display: grid; gap: 22px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
h2 { font-family: var(--display); font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: 0.02em; margin: 0; line-height: 1.1; }
h3 { font-family: var(--display); font-weight: 700; font-size: 18px; text-transform: uppercase; letter-spacing: 0.03em; margin: 0; }
.muted { color: var(--ink-3); font-size: 13px; }

/* Report card */
.report { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 0; overflow: hidden; }
@media (max-width: 820px) { .report { grid-template-columns: 1fr; } }
.window { padding: 20px; display: grid; gap: 12px; align-content: start; border-right: 1px solid var(--line); }
@media (max-width: 820px) { .window { border-right: 0; border-bottom: 1px solid var(--line); } }
.team-name { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.05; text-wrap: balance; }
.verdict { display: inline-flex; align-items: center; gap: 8px; justify-self: start; font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 14px; border-radius: 4px; border: 2px solid currentColor; }
.verdict.contend { color: var(--good); background: var(--good-soft); }
.verdict.rebuild { color: var(--bad); background: var(--bad-soft); }
.verdict.retool, .verdict.rising { color: var(--warn); background: var(--warn-soft); }
.window p { margin: 0; color: var(--ink-2); max-width: 52ch; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpi { border-top: 2px solid var(--line); padding-top: 6px; min-width: 0; }
.kpi .k { font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.kpi .v { font-family: var(--mono); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--ink-3); }
.grades { padding: 20px; display: grid; gap: 14px; align-content: start; }
.grade-row { display: grid; grid-template-columns: 44px 52px minmax(0, 1fr); gap: 12px; align-items: center; }
.pos { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: 0.04em; }
.letter { font-family: var(--display); font-weight: 800; font-size: 26px; text-align: center; border-radius: 4px; line-height: 1.25; }
.letter.A { color: var(--good); background: var(--good-soft); }
.letter.B { color: var(--accent); background: var(--accent-soft); }
.letter.C { color: var(--warn); background: var(--warn-soft); }
.letter.D, .letter.F { color: var(--bad); background: var(--bad-soft); }
.gbar { display: grid; gap: 3px; min-width: 0; }
.track { position: relative; height: 10px; background: var(--line-2); border-radius: 5px; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--accent); }
.avgmark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-2); }
.gmeta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-3); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.gmeta b { color: var(--ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--ink-3); }
.legend i { display: inline-block; vertical-align: middle; margin-right: 5px; }
.legend .sw { width: 14px; height: 8px; border-radius: 4px; background: var(--accent); }
.legend .tk { width: 2px; height: 12px; background: var(--ink-2); }

/* Blueprint */
.plan { display: grid; gap: 14px; }
.step { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 0; overflow: hidden; }
.step-n { background: var(--card-2); border-right: 2px solid var(--orange); color: var(--orange); font-family: var(--display); font-weight: 800; font-size: 28px; display: grid; place-items: start center; padding-top: 16px; }
.step-b { padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.step-b > p { margin: 0; color: var(--ink-2); max-width: 70ch; }
.moves { display: grid; gap: 10px; }
.move { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.move-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.act { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; }
.act.add, .act.start, .act.get { background: var(--good-soft); color: var(--good); }
.act.drop, .act.bench, .act.give { background: var(--bad-soft); color: var(--bad); }
.act.with { background: var(--accent-soft); color: var(--accent); }
.pl { font-weight: 600; }
.pm { font-family: var(--mono); font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.why { font-size: 14px; color: var(--ink-2); margin: 0; }
.trade { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
@media (max-width: 560px) { .trade { grid-template-columns: 1fr; } }
.side { background: var(--bg); border-radius: 5px; padding: 8px 10px; display: grid; gap: 4px; min-width: 0; }
.empty { color: var(--ink-3); font-size: 14px; margin: 0; }
.inj { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: 0.06em; color: var(--bad); border: 1px solid currentColor; border-radius: 3px; padding: 0 4px; }

/* League board */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
td.n { font-family: var(--mono); text-align: right; }
th.n { text-align: right; }
tr.me td { background: var(--accent-soft); }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--line-2); }
tr.me.click:hover td { background: var(--accent-soft); }
.wtag { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
.wtag.contend { color: var(--good); } .wtag.rebuild { color: var(--bad); } .wtag.retool, .wtag.rising { color: var(--warn); }
.board { padding: 16px 0 4px; display: grid; gap: 10px; }
.board .sec-h { padding: 0 16px; }
.method { padding: 16px 18px; display: grid; gap: 8px; }
.method ul { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 14px; display: grid; gap: 4px; }
.loading { padding: 28px; text-align: center; color: var(--ink-3); }
</style>

<div class="band">
  <div class="in">
    <div class="brand">
      <div class="lockup">
        <div class="badge" aria-hidden="true">G<b>M</b></div>
        <h1><span class="g">Gridiron</span><span class="m">Metrics</span></h1>
      </div>
      <div>
        <div class="tool">Dynasty Blueprint</div>
        <p class="tagline">Your team graded on real stats, plus the moves to make next.</p>
      </div>
    </div>
    <form class="connect" id="connect">
      <label class="f"><span class="lbl">Sleeper username</span><input id="user" type="text" autocomplete="off" placeholder="your_username"></label>
      <label class="f"><span class="lbl">League</span><select id="league" disabled><option>Enter a username first</option></select></label>
      <label class="f"><span class="lbl">Team to analyze</span><select id="team" disabled><option>—</option></select></label>
      <button class="go" id="go" type="submit">Find leagues</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>
</div>

<div class="main" id="out"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const POS = ["QB", "RB", "WR", "TE"];
  const FLEX_ELIG = { FLEX: ["RB","WR","TE"], SUPER_FLEX: ["QB","RB","WR","TE"], REC_FLEX: ["WR","TE"], WRRB_FLEX: ["RB","WR"] };
  const BAD_STATUS = { Out: 0, IR: 0, PUP: 0, Sus: 0, NA: 0, Doubtful: 0.3, Questionable: 0.85 };

  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) { if (k === "class") e.className = attrs[k]; else if (k === "text") e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
    kids.flat().forEach((c) => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
    return e;
  }
  const f1 = (v) => (v == null || !isFinite(v)) ? "—" : v.toFixed(1);
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }
  function setMsg(...nodes) { const m = $("msg"); m.innerHTML = ""; nodes.forEach((n) => m.append(typeof n === "string" ? el("span", null, n) : n)); }
  function errMsg(t) { return el("span", { class: "err" }, t); }

  // ---------------- Scoring ----------------
  function scoreStats(s, sc) {
    if (!s) return 0;
    let p = 0, used = false;
    for (const k in sc) { const v = s[k]; if (typeof v === "number" && sc[k]) { p += v * sc[k]; used = true; } }
    if (!used || p === 0) { if (typeof s.pts_ppr === "number") return s.pts_ppr; }
    return p;
  }

  // ---------------- Dynasty age curves ----------------
  function ageMult(pos, age) {
    if (!age) return 1;
    if (pos === "RB") return age <= 24 ? 1.15 : age === 25 ? 1 : age === 26 ? 0.85 : age === 27 ? 0.7 : age === 28 ? 0.55 : 0.4;
    if (pos === "WR") return age <= 25 ? 1.15 : age <= 27 ? 1 : age === 28 ? 0.9 : age === 29 ? 0.8 : age === 30 ? 0.65 : 0.5;
    if (pos === "TE") return age <= 26 ? 1.1 : age <= 29 ? 1 : age === 30 ? 0.85 : age === 31 ? 0.7 : 0.55;
    if (pos === "QB") return age <= 28 ? 1.1 : age <= 32 ? 1 : age <= 34 ? 0.85 : age === 35 ? 0.7 : 0.55;
    return 1;
  }
  const CLIFF = { RB: 27, WR: 30, TE: 31, QB: 34 };

  // ---------------- Data loading (Sleeper) ----------------
  let state = null, allPlayers = null, me = null, leagues = [];
  async function nflState() { if (!state) { try { state = await getJSON("https://api.sleeper.app/v1/state/nfl"); } catch (e) { state = { season: "2026", week: 10 }; } } return state; }
  async function playersDB() {
    if (!allPlayers) allPlayers = getJSON("https://api.sleeper.app/v1/players/nfl").catch((e) => { allPlayers = null; throw e; });
    return allPlayers;
  }
  const POSQ = POS.map((p) => "position[]=" + p).join("&");
  async function seasonStats(season) {
    try {
      const arr = await getJSON(`https://api.sleeper.com/stats/nfl/${season}?season_type=regular&${POSQ}`);
      const out = {}; (Array.isArray(arr) ? arr : []).forEach((r) => { if (r && r.player_id && r.stats) out[r.player_id] = r.stats; });
      if (Object.keys(out).length) return out;
      throw new Error("empty");
    } catch (e) {
      try { return await getJSON(`https://api.sleeper.app/v1/stats/nfl/regular/${season}`); } catch (e2) { return {}; }
    }
  }
  async function weekProj(season, week) {
    try {
      const arr = await getJSON(`https://api.sleeper.com/projections/nfl/${season}/${week}?season_type=regular&${POSQ}`);
      const out = {}; (Array.isArray(arr) ? arr : []).forEach((r) => { if (r && r.player_id && r.stats) out[r.player_id] = r.stats; });
      if (Object.keys(out).length) return out;
      throw new Error("empty");
    } catch (e) {
      try { return await getJSON(`https://api.sleeper.app/v1/projections/nfl/regular/${season}/${week}`); } catch (e2) { return null; }
    }
  }

  async function loadLeague(lg) {
    const st = await nflState();
    const season = String(lg.season);
    const week = String(st.season) === season ? Math.max(1, parseInt(st.display_week || st.week, 10) || 1) : 1;
    const [league, rosters, users, db, cur, prev, proj] = await Promise.all([
      getJSON(`https://api.sleeper.app/v1/league/${lg.league_id}`),
      getJSON(`https://api.sleeper.app/v1/league/${lg.league_id}/rosters`),
      getJSON(`https://api.sleeper.app/v1/league/${lg.league_id}/users`),
      playersDB(),
      seasonStats(season),
      seasonStats(String(parseInt(season, 10) - 1)),
      String(st.season) === season && (st.season_type === "regular" || !st.season_type) ? weekProj(season, week) : Promise.resolve(null),
    ]);
    const sc = league.scoring_settings || {};
    const umap = {}; users.forEach((u) => { umap[u.user_id] = u; });
    const rostered = new Set();
    const teams = rosters.map((r) => {
      const u = umap[r.owner_id] || {};
      const ids = (r.players || []).filter(Boolean);
      ids.forEach((id) => rostered.add(id));
      return {
        id: String(r.roster_id), ownerId: r.owner_id,
        name: (u.metadata && u.metadata.team_name) || u.display_name || ("Team " + r.roster_id),
        owner: u.display_name || "",
        wins: (r.settings && r.settings.wins) || 0, losses: (r.settings && r.settings.losses) || 0, ties: (r.settings && r.settings.ties) || 0,
        pf: ((r.settings && r.settings.fpts) || 0) + ((r.settings && r.settings.fpts_decimal) || 0) / 100,
        ids, starters: (r.starters || []).filter((x) => x && x !== "0"), taxi: new Set(r.taxi || []), reserve: new Set(r.reserve || []),
      };
    });
    const players = {};
    const want = (p) => p && POS.includes(p.position);
    const mk = (id) => {
      const p = db[id]; if (!want(p)) return null;
      const s = cur[id], ps = prev[id];
      const gp = (s && (s.gp || s.gms_active)) || 0;
      const pts = scoreStats(s, sc), ppts = scoreStats(ps, sc);
      const pgp = (ps && (ps.gp || ps.gms_active)) || 0;
      let ppg = gp > 0 ? pts / gp : null, src = "cur";
      if ((gp < 3) && pgp >= 4) { const pp = ppts / pgp; ppg = gp > 0 ? (pts + pp * 3) / (gp + 3) : pp * 0.9; src = "blend"; }
      const pr = proj && proj[id] ? scoreStats(proj[id], sc) : null;
      return { id, name: p.full_name || (p.first_name + " " + p.last_name), pos: p.position, nfl: p.team || "FA", age: p.age || null, inj: p.injury_status || null, gp, ppg: ppg == null ? 0 : ppg, src, proj: pr, active: !!p.active, years: p.years_exp };
    };
    rostered.forEach((id) => { const p = mk(id); if (p) players[id] = p; });
    const fa = [];
    for (const id in cur) {
      if (rostered.has(id)) continue;
      const p = mk(id); if (!p || !p.active || p.nfl === "FA") continue;
      if (p.gp >= 2 || p.ppg > 0) { players[id] = p; fa.push(id); }
    }
    const rec = sc.rec || 0;
    const sf = (league.roster_positions || []).includes("SUPER_FLEX");
    const fmt = [sf ? "Superflex" : "1QB", rec === 1 ? "PPR" : rec === 0.5 ? "Half PPR" : rec === 0 ? "Standard" : rec + " PPR", (sc.bonus_rec_te ? "TE premium" : null)].filter(Boolean).join(" · ");
    const type = league.settings && league.settings.type;
    return {
      name: league.name, season, week, slots: league.roster_positions || [], teams, players, fa, hasProj: !!proj,
      fmt, isDynasty: type === 2, typeLabel: type === 2 ? "Dynasty" : type === 1 ? "Keeper" : "Redraft",
    };
  }

  // ---------------- Analysis ----------------
  function starterSlots(slots) { return slots.filter((s) => POS.includes(s) || FLEX_ELIG[s]); }
  function optimalLineup(ids, slots, metric) {
    const avail = ids.slice().sort((a, b) => metric(b) - metric(a));
    const used = new Set(), lineup = [];
    const order = ["QB","TE","RB","WR","REC_FLEX","WRRB_FLEX","FLEX","SUPER_FLEX"];
    const ss = starterSlots(slots).slice().sort((a, b) => order.indexOf(a) - order.indexOf(b));
    for (const s of ss) {
      const elig = POS.includes(s) ? [s] : FLEX_ELIG[s];
      const pick = avail.find((id) => !used.has(id) && elig.includes(L.players[id].pos));
      if (pick) { used.add(pick); lineup.push({ slot: s, id: pick }); } else lineup.push({ slot: s, id: null });
    }
    return lineup;
  }
  function analyze(Lg) {
    const slots = Lg.slots;
    const ss = starterSlots(slots);
    const ded = {}; POS.forEach((p) => ded[p] = ss.filter((s) => s === p).length);
    const flexN = ss.filter((s) => FLEX_ELIG[s]).length;
    const sfN = ss.filter((s) => s === "SUPER_FLEX").length;
    // how many of each position a team "starts" for grading

    const teams = names.map((nm, i) => {
      const ids = [];
      [["QB",3],["RB",6],["WR",8],["TE",3]].forEach(([p, c]) => { for (let k = 0; k < c; k++) ids.push(make(p)); });
      const w = Math.floor(rnd() * 9);
      return { id: String(i + 1), name: nm, owner: "", wins: w, losses: 9 - w, ties: 0, pf: 900 + rnd() * 350, ids, starters: [], taxi: new Set(), reserve: new Set() };
    });
    const fa = []; [["QB",6],["RB",14],["WR",16],["TE",8]].forEach(([p, c]) => { for (let k = 0; k < c; k++) { const id = make(p); players[id].ppg *= 0.6; players[id].proj *= 0.6; fa.push(id); } });
    const Lg = { name: "Example League", season: "2026", week: 10, slots, teams, players, fa, hasProj: true, fmt: "Superflex · PPR", isDynasty: true, typeLabel: "Dynasty", sample: true };
    // give each team a slightly-off current lineup
    L = Lg;
    teams.forEach((t) => {
      const lu = optimalLineup(t.ids, slots, (id) => players[id].ppg);
      t.starters = lu.map((x) => x.id).filter(Boolean);
      const benchRB = t.ids.find((id) => players[id].pos === "RB" && !t.starters.includes(id));
      const startRB = t.starters.find((id) => players[id].pos === "RB" && players[id].inj);
      if (benchRB && startRB == null) { const i = t.starters.findIndex((id) => players[id].pos === "RB"); if (i >= 0 && rnd() < 0.6) t.starters[i] = benchRB; }
    });
    return Lg;
  }

  // ---------------- Wiring ----------------
  function useLeague(Lg, teamId) {
    L = Lg; analyze(L);
    myTeamId = teamId || L.teams[0].id;
    const sel = $("team"); sel.innerHTML = "";
    L.teams.forEach((t) => sel.append(el("option", { value: t.id }, t.name + (t.owner ? " (" + t.owner + ")" : ""))));
    sel.value = myTeamId; sel.disabled = false;
    render();
  }

  $("connect").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = $("user").value.trim();
    if (!name) { setMsg(errMsg("Enter your Sleeper username.")); return; }
    $("go").disabled = true;
    setMsg("Looking up " + name + "…");
    try {
      me = await getJSON("https://api.sleeper.app/v1/user/" + encodeURIComponent(name));
      if (!me || !me.user_id) throw new Error("notfound");
      store.set("fob_user", name);
      const st = await nflState();
      const season = String(st.league_season || st.season || "2026");
      let ls = await getJSON(`https://api.sleeper.app/v1/user/${me.user_id}/leagues/nfl/${season}`);
      if (!ls.length) ls = await getJSON(`https://api.sleeper.app/v1/user/${me.user_id}/leagues/nfl/${parseInt(season, 10) - 1}`);
      leagues = ls.sort((a, b) => ((b.settings && b.settings.type) === 2) - ((a.settings && a.settings.type) === 2));
      const sel = $("league"); sel.innerHTML = "";
      if (!leagues.length) { sel.append(el("option", null, "No leagues found")); sel.disabled = true; setMsg(errMsg("No " + season + " leagues found for " + name + ".")); return; }
      leagues.forEach((l) => sel.append(el("option", { value: l.league_id }, l.name + " · " + ((l.settings && l.settings.type) === 2 ? "Dynasty" : (l.settings && l.settings.type) === 1 ? "Keeper" : "Redraft"))));
      sel.disabled = false;
      await openLeague(leagues[0].league_id);
    } catch (err) {
      setMsg(errMsg(err.message === "notfound" ? `No Sleeper user named "${name}". Check the spelling.` : "Couldn't reach Sleeper (" + err.message + "). Check your connection and try again."));
    } finally { $("go").disabled = false; }
  });
  $("league").addEventListener("change", () => openLeague($("league").value));
  $("team").addEventListener("change", () => { myTeamId = $("team").value; render(); });

  async function openLeague(id) {
    const lg = leagues.find((l) => l.league_id === id); if (!lg) return;
    setMsg("Loading " + lg.name + ": rosters, stats and projections. The player list is large, so the first load takes a few seconds…");
    $("out").innerHTML = ""; $("out").append(el("div", { class: "card loading" }, "Crunching the numbers…"));
    try {
      const Lg = await loadLeague(lg);
      const mine = Lg.teams.find((t) => t.ownerId === me.user_id);
      useLeague(Lg, mine && mine.id);
      const notes = [L.name + " · " + L.teams.length + " teams · " + L.fmt];
      if (!L.isDynasty) notes.push(errMsg("This is a " + L.typeLabel.toLowerCase() + " league. The blueprint is tuned for dynasty, so treat the future-value advice loosely."));
      setMsg(...notes);
    } catch (err) {
      setMsg(errMsg("Couldn't load that league (" + err.message + "). Try again, or pick another league."));
      $("out").innerHTML = "";
    }
  }

  // Start with the example league so the page shows what it does.
  const saved = store.get("fob_user"); if (saved) $("user").value = saved;
  useLeague(sampleLeague(), "1");
  setMsg(el("span", { class: "chip-sample" }, "Example"), "A made-up league with invented players. Enter your Sleeper username to load yours.");
})();
</script>
